server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
spring:
  datasource:
    url: jdbc:h2:mem:twse_strategy_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
app:
  market-history:
    enabled: ${APP_MARKET_HISTORY_ENABLED:true}
  live-market-data:
    enabled: ${APP_LIVE_MARKET_DATA_ENABLED:true}
